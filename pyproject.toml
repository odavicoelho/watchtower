[project]
name = "watchtower"
version = "0.1.0"
description = "A small, production-style web monitoring pipeline: collect, store history, detect changes, alert."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Davi Coelho", email = "coelhodavi.comercial@gmail.com" }]
dependencies = [
  "httpx>=0.28",
  "selectolax>=1.0",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "typer>=0.15",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22", "ruff>=0.9", "mypy>=1.14", "types-PyYAML"]

[project.scripts]
watchtower = "watchtower.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchtower"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["watchtower"]

[tool.pytest.ini_options]
testpaths = ["tests"]
