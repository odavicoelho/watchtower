# Watchtower configuration. Every source listed here is fetched on each run.
user_agent: "watchtower/0.1 (+https://github.com/odavicoelho/watchtower)"
database: data/watchtower.db

http:
  timeout: 20
  retries: 3
  backoff_seconds: 1
  delay_seconds: 1  # be polite: at most one request per second per site

sources:
  - type: books_toscrape
    options:
      max_pages: 50  # the whole catalogue: 1,000 books
  - type: bcb_ptax
    options:
      currencies: [USD, EUR]

# Rules: optional `source` / `key` limit a rule to one source or one item.
rules:
  - type: price_drop
    options: {min_percent: 10}
  - type: new_item
  - type: stock_change
  - type: threshold  # the dollar leaving its usual band
    options: {source: bcb_ptax, key: USD, above: 5.10, below: 4.90}
  - type: value_rise  # a sharp daily jump in any currency
    options: {source: bcb_ptax, min_percent: 1.5}

# Notifiers. Secrets always come from environment variables, never from this file.
#   github_issue: GITHUB_TOKEN + GITHUB_REPOSITORY (set automatically inside GitHub Actions)
#   email:        WATCHTOWER_SMTP_USER + WATCHTOWER_SMTP_PASSWORD (+ optional _HOST, _PORT)
#   webhook:      WATCHTOWER_WEBHOOK_URL
notifiers:
  - type: console
