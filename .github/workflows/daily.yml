name: Daily run

on:
  schedule:
    # 17:00 UTC = 14:00 in Brasília, after Banco Central publishes the day's closing PTAX.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write   # save the database to the `data` branch
  issues: write     # open alert issues
  pages: write      # publish the dashboard
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # The database lives on its own branch: one commit, replaced every day. The data itself holds the history.
      - name: Restore database
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:watchtower.db > data/watchtower.db
            echo "restored $(du -h data/watchtower.db | cut -f1) database"
          else
            echo "no data branch yet: starting fresh"
          fi

      - name: Run pipeline
        id: pipeline
        continue-on-error: true  # a partial run still saves data and updates the dashboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: watchtower run --config config.demo.yaml

      - name: Save database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/data-branch && cp data/watchtower.db /tmp/data-branch/
          cd /tmp/data-branch
          git init -q -b data
          git add watchtower.db
          git -c user.name="watchtower[bot]" -c user.email="watchtower@users.noreply.github.com" \
            commit -q -m "Database after run on $(date -u +%F)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Build dashboard
        run: watchtower report --config config.demo.yaml --out site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Fail if the pipeline failed
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::warning::Pipeline finished with a partial or failed status; see the 'Run pipeline' step."
          exit 1
